<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf2ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Roses">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <title>Roses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header>
      <p class="eyebrow" id="greeting"></p>
      <h1 id="date"></h1>
    </header>

    <section id="stage">
      <button id="gift" type="button" aria-label="Open today's flowers">
        <svg class="envelope" viewBox="0 0 220 150" aria-hidden="true">
          <defs>
            <linearGradient id="env" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fffaf4"/>
              <stop offset="1" stop-color="#f1e3d6"/>
            </linearGradient>
          </defs>
          <rect x="6" y="10" width="208" height="132" rx="8" fill="url(#env)" stroke="#e2cdbd"/>
          <path d="M6 138 L92 78 M214 138 L128 78" stroke="#e2cdbd" fill="none"/>
          <path class="flap" d="M8 14 L110 86 L212 14 Z" fill="#f7ece2" stroke="#e2cdbd" stroke-linejoin="round"/>
          <circle cx="110" cy="84" r="17" fill="#b3122b"/>
          <circle cx="110" cy="84" r="13" fill="none" stroke="#8a0c1e" stroke-width="1.5"/>
          <path d="M110 92 C 98 84, 102 74, 110 80 C 118 74, 122 84, 110 92 Z" fill="#f6c9cf"/>
        </svg>
        <span class="gift-label">Tap to open today's flowers</span>
      </button>

      <div id="bouquet" hidden></div>
      <p id="hint" hidden>Drag to turn it · tap a flower</p>
      <p id="bouquet-name" hidden></p>
    </section>

    <article id="note" hidden>
      <p id="note-text"></p>
      <p id="note-sign"></p>
    </article>

    <nav id="days" aria-label="Past bouquets"></nav>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
